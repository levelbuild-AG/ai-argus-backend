tenants:
  - tenantId: tenant-levelbuild
    name: levelbuild
    dbUri: mongodb://tenant-mongo:27017/tenant_levelbuild
    config:
      storage:
        provider: s3
        bucket: bucket-a
        prefix: tenant-levelbuild/
      rag:
        postgresUri: postgres://myuser:mypassword@postgres:5432/tenant_levelbuild
        vectorDbType: pgvector
      googleServiceKeyEnv: TENANT_LEVELBUILD_GOOGLE_KEY_JSON

