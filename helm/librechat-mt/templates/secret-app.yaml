apiVersion: v1
kind: Secret
metadata:
  name: {{ include "librechat-mt.fullname" . }}-secrets
  labels:
    {{- include "librechat-mt.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_AUTH_SECRET: {{ .Values.secrets.adminAuthSecret | default "" | quote }}
  RAG_INTERNAL_AUTH_SECRET: {{ .Values.secrets.ragInternalAuthSecret | default "" | quote }}
  MEILI_MASTER_KEY: {{ .Values.meilisearch.masterKey | default "" | quote }}


