apiVersion: v1
kind: Secret
metadata:
  name: {{ include "librechat-mt.fullname" . }}-bootstrap-secrets
  labels:
    {{- include "librechat-mt.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Raw JSON for tenant-levelbuild Google service account
  TENANT_LEVELBUILD_GOOGLE_KEY_JSON: {{ .Values.secrets.tenantLevelbuildGoogleKeyJson | default "" | quote }}

