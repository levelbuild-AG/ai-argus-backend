{{- if eq .Values.ragApi.workloadType "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "librechat-mt.fullname" . }}-rag-api
  labels:
    {{- include "librechat-mt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ragApi.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: rag-api
      {{- include "librechat-mt.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: rag-api
        {{- include "librechat-mt.labels" . | nindent 8 }}
    spec:
      envFrom:
        - secretRef:
            name: {{ include "librechat-mt.fullname" . }}-secrets
      containers:
        - name: rag-api
          image: "{{ .Values.ragApi.image.repository }}:{{ .Values.ragApi.image.tag }}"
          imagePullPolicy: {{ .Values.ragApi.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.ragApi.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ragApi.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ragApi.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ragApi.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.ragApi.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.ragApi.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.ragApi.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.ragApi.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.ragApi.resources | nindent 12 }}
{{- end }}

