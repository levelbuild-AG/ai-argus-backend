# Multi-tenant integration test stack.
# Run: docker compose -f docker-compose.mt-it.yml up -d
# Requires: ADMIN_AUTH_SECRET, RAG_INTERNAL_AUTH_SECRET (min 16 chars each) in .env or environment.

services:
  system-mongo:
    image: mongo:7
    container_name: mt-it-system-mongo
    ports: ["27017:27017"]
    command: mongod --noauth
    networks: [mt-it-net]
    volumes: [system-mongo-data:/data/db]

  tenant-mongo-a:
    image: mongo:7
    container_name: mt-it-tenant-mongo-a
    ports: ["27018:27017"]
    command: mongod --noauth
    networks: [mt-it-net]
    volumes: [tenant-mongo-a-data:/data/db]

  tenant-mongo-b:
    image: mongo:7
    container_name: mt-it-tenant-mongo-b
    ports: ["27019:27017"]
    command: mongod --noauth
    networks: [mt-it-net]
    volumes: [tenant-mongo-b-data:/data/db]

  pg-a:
    image: pgvector/pgvector:pg15
    container_name: mt-it-pg-a
    environment:
      POSTGRES_DB: tenant_a
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    networks: [mt-it-net]
    volumes: [pg-a-data:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  pg-b:
    image: pgvector/pgvector:pg15
    container_name: mt-it-pg-b
    environment:
      POSTGRES_DB: tenant_b
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    networks: [mt-it-net]
    volumes: [pg-b-data:/var/lib/postgresql/data]
    ports: ["5433:5432"]

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: mt-it-meilisearch
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyMin16Chars}
    networks: [mt-it-net]
    volumes: [meili-data:/meili_data]
    ports: ["7700:7700"]

  redis:
    image: redis:7-alpine
    container_name: mt-it-redis
    networks: [mt-it-net]
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    container_name: mt-it-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks: [mt-it-net]
    volumes: [minio-data:/data]
    ports: ["9000:9000"]

  minio-init:
    image: minio/mc:latest
    container_name: mt-it-minio-init
    depends_on: [minio]
    networks: [mt-it-net]
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/bucket-a --ignore-existing;
      mc mb myminio/bucket-b --ignore-existing;
      exit 0;
      "

  rag_api:
    build:
      context: ./infra/rag_api
    image: librechat-rag-api-mt-it:local
    container_name: mt-it-rag-api
    environment:
      RAG_HOST: "0.0.0.0"
      RAG_PORT: "8000"
      SYSTEM_MONGO_URI: mongodb://system-mongo:27017/LibreChat
      SYSTEM_MONGO_DB: LibreChat
      RAG_INTERNAL_AUTH_SECRET: ${RAG_INTERNAL_AUTH_SECRET:-rag-internal-secret-min-16-chars}
      JWT_SECRET: ${JWT_SECRET:-jwt-secret}
      # MT-IT: deterministic fake embeddings (no OpenAI key); validates tenant routing
      RAG_FAKE_EMBEDDINGS: "1"
    depends_on: [system-mongo]
    networks: [mt-it-net]
    ports: ["8001:8000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 2s
      retries: 20

  api:
    build: .
    image: librechat-mt-it:local
    container_name: mt-it-api
    environment:
      HOST: "0.0.0.0"
      PORT: "3080"
      MONGO_URI: mongodb://system-mongo:27017/LibreChat
      SYSTEM_MONGO_URI: mongodb://system-mongo:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyMin16Chars}
      RAG_API_URL: http://rag_api:8000
      RAG_INTERNAL_AUTH_SECRET: ${RAG_INTERNAL_AUTH_SECRET:-rag-internal-secret-min-16-chars}
      # MT-IT: pin ADMIN_AUTH_SECRET so host and container can be aligned deterministically
      ADMIN_AUTH_SECRET: admin-auth-secret-min-16-chars
      # MT-IT: deterministic S3/MinIO credentials for AWS SDK in the api container
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_EC2_METADATA_DISABLED: "true"
      MULTI_TENANCY_ENABLED: "true"
      USE_REDIS: "true"
      REDIS_URI: redis://redis:6379
      MT_E2E_INTERNAL_ROUTES: "1"
      # S3/MinIO config for MT-IT so initializeS3 creates a valid client
      AWS_REGION: us-east-1
    depends_on: [system-mongo, rag_api, meilisearch, redis]
    networks: [mt-it-net]
    ports: ["3081:3080"]
    volumes:
      - ./.env:/app/.env:ro

volumes:
  system-mongo-data:
  tenant-mongo-a-data:
  tenant-mongo-b-data:
  pg-a-data:
  pg-b-data:
  meili-data:
  minio-data:

networks:
  mt-it-net:
    driver: bridge
