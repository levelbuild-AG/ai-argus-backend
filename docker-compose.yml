services:
  # System database (Users, Tenants, Sessions)
  system-mongo:
    image: mongo:7
    command: mongod --noauth
    restart: unless-stopped
    volumes:
      - system-mongo-data:/data/db
    networks:
      - librechat-net

  # Shared tenant Mongo host (multiple DBs per tenant via dbUri in tenant config)
  tenant-mongo:
    image: mongo:7
    command: mongod --noauth
    restart: unless-stopped
    volumes:
      - tenant-mongo-data:/data/db
    networks:
      - librechat-net

  # Shared Postgres/pgvector instance for all tenants
  postgres:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_DB: librechat_rag
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - pgdata2:/var/lib/postgresql/data
      - ./scripts/init-tenant-rag-dbs.sql:/docker-entrypoint-initdb.d/init-tenant-rag-dbs.sql:ro
    networks:
      - librechat-net

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyMin16Chars}
    volumes:
      - meili-data:/meili_data
    networks:
      - librechat-net

  # Health checks could be added here as needed (e.g. curl for api/rag_api) once endpoints are finalized.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - librechat-net

  minio:
    image: minio/minio:latest
    command: server /data
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    networks:
      - librechat-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/bucket-a --ignore-existing;
      mc mb myminio/bucket-b --ignore-existing;
      exit 0;
      "
    networks:
      - librechat-net

  rag_api:
    build:
      context: ./infra/rag_api
    image: librechat-rag-api-dev:local
    restart: unless-stopped
    environment:
      RAG_HOST: "0.0.0.0"
      RAG_PORT: "${RAG_PORT:-8000}"
      DB_HOST: postgres
      SYSTEM_MONGO_URI: "mongodb://system-mongo:27017/LibreChat"
      SYSTEM_MONGO_DB: "LibreChat"
      RAG_INTERNAL_AUTH_SECRET: ${RAG_INTERNAL_AUTH_SECRET:-rag-internal-secret-min-16-chars}
      JWT_SECRET: ${JWT_SECRET:-jwt-secret}
    depends_on:
      - postgres
      - system-mongo
    env_file:
      - .env
    networks:
      - librechat-net

  api:
    build:
      context: .
    image: librechat-mt-dev:local
    restart: unless-stopped
    ports:
      - "3082:3080"
    depends_on:
      - system-mongo
      - rag_api
      - meilisearch
      - redis
      - minio
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3080"
      MONGO_URI: "mongodb://system-mongo:27017/LibreChat"
      SYSTEM_MONGO_URI: "mongodb://system-mongo:27017/LibreChat"
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyMin16Chars}
      RAG_API_URL: "http://rag_api:${RAG_PORT:-8000}"
      RAG_INTERNAL_AUTH_SECRET: ${RAG_INTERNAL_AUTH_SECRET:-rag-internal-secret-min-16-chars}
      MULTI_TENANCY_ENABLED: "true"
      USE_REDIS: "true"
      REDIS_URI: "redis://redis:6379"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: "http://minio:9000"
      AWS_EC2_METADATA_DISABLED: "true"
      # Dev-only: disable ban checks for local development.
      # Do NOT copy this into production; leave DEV_DISABLE_BAN_CHECK unset there.
      DEV_DISABLE_BAN_CHECK: "true"
    volumes:
      - ./.env:/app/.env:ro
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - librechat-net
volumes:
  system-mongo-data:
  tenant-mongo-data:
  pgdata2:
  meili-data:
  minio-data:

networks:
  librechat-net:
    driver: bridge
